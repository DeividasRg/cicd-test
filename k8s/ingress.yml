apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cicd-test
  namespace: dev
spec:
  ingressClassName: traefik
  rules:
    - host: cicd-test.dragauskas.lt
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cicd-test
                port:
                  number: 80
