apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-test
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cicd-test
  template:
    metadata:
      labels:
        app: cicd-test
    spec:
      containers:
        - name: cicd-test
          image: deividasrg/cicd-test:manual-test
          ports:
            - containerPort: 3000
